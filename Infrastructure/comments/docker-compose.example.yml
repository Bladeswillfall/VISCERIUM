services:
  remark42:
    # Pin both the release and manifest digest. Update deliberately after testing.
    image: ghcr.io/umputun/remark42:v1.16.4@sha256:980e0e76a6f241cd181f44c5b4d686f0d8cd7f552e11deb3bdcba223b2c3b866
    container_name: remark42
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REMARK_URL: "https://comments.viscerium.co.uk"
      SITE: "viscerium"
      MAX_COMMENT_SIZE: "2048"
      IMAGE_MAX_SIZE: "1"
      IMAGE_PROXY_HTTP2HTTPS: "false"
      IMAGE_PROXY_CACHE_EXTERNAL: "false"
      DISABLE_SIGNATURE: "true"
      RESTRICTED_NAMES: "VISCERIUM,Admin,Administrator,Moderator,Mod,Staff,System,Official,Support"
      TRUSTED_PROXY: "127.0.0.1/32,172.16.0.0/12"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - "./var:/srv/var"
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  comment-gateway:
    build:
      context: ../../Services/comment-gateway
    container_name: viscerium-comment-gateway
    restart: unless-stopped
    env_file:
      - .gateway.env
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      REMARK42_UPSTREAM_URL: "http://remark42:8080"
      REMARK42_SITE_ID: "viscerium"
      COMMENT_ORIGINS: "https://www.viscerium.co.uk"
      MAX_REQUEST_BYTES: "65536"
      MAX_COMMENT_BYTES: "2048"
      MAX_EXTERNAL_LINKS: "3"
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      remark42:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    logging:
      options:
        max-size: "10m"
        max-file: "3"
