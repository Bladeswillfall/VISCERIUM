<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="modulepreload" href="remark.mjs" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Comments</title>
    <base target="_blank" />
    <!--
      Based on Remark42 v1.16.4's production iframe template (MIT).
      VISCERIUM keeps Remark42's stock theme, composer, links, buttons and
      interaction behaviour. This shell adds only the no-upload guard and a
      small account-identity presentation layer. Review it whenever the pinned
      Remark42 release changes.
    -->
    <style>
      /* Hide the upload affordance immediately; the script below also removes
         dynamically-created upload controls from reply/edit forms. */
      label:has(input[type='file']) {
        display: none !important;
      }

      /*
        Account metadata only. Do not put Remark42 palette overrides here.
        Metadata is rendered with CSS generated content from data attributes on
        existing Remark42 nodes. We never insert children into Preact-owned
        comment markup, so Preact has nothing custom to reconcile or remove.
      */
      [data-vc-meta] {
        flex-wrap: wrap;
        align-content: flex-start;
      }

      [data-vc-meta]::after {
        content: attr(data-vc-meta);
        display: block;
        flex: 0 0 100%;
        min-height: 13px;
        margin-top: 1px;
        font-size: 10px;
        font-weight: 400;
        line-height: 1.2;
        letter-spacing: 0.035em;
        opacity: 0.76;
        white-space: nowrap;
      }

      [data-vc-role='staff']::after {
        font-weight: 700;
        letter-spacing: 0.045em;
        opacity: 1;
      }

      [data-vc-time] {
        align-self: flex-start;
        margin-top: 1px;
      }
    </style>
    <script>
      if (window.location.search === '?selfClose') {
        window.close();
      }
      (function () {
        try {
          var pairs = window.location.search.substring(1).split('&');
          var theme = '';

          for (var i = 0; i < pairs.length; i++) {
            var pair = pairs[i].split('=');
            if (pair[0] === 'theme') {
              theme = decodeURIComponent(pair[1] || '');
              break;
            }
          }

          document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
        } catch (e) {}
      })();
      (function () {
        function isCSSVariablesSupported() {
          if (typeof window === 'undefined') {
            return true;
          }

          return window.CSS && window.CSS.supports && window.CSS.supports('color', 'var(--fake-var)');
        }
        if (isCSSVariablesSupported()) {
          try {
            var name = JSON.parse(window.name);
            var colors = name.__colors__;
            var root = document.documentElement;
            if (colors) {
              for (var color in colors) {
                if (!color.startsWith('--')) {
                  console.info('Key ' + color + ' must start with `--`');
                  continue;
                }
                root.style.setProperty(color, colors[color]);
              }
            }
          } catch (e) {}
        }
      })();
    </script>
    <link rel="stylesheet" href="remark.css" />
  </head>
  <body>
    <div id="remark42">
      <div class="preloader preloader_view_iframe"></div>
    </div>
    <script>
      var commentHashPattern = /^#remark42__comment-([A-Za-z0-9_-]{1,128})$/;

      window.addEventListener('message', function receiveMessages(event) {
        try {
          // The embedding page is the only legitimate sender. This mirrors
          // Remark42's own isFromParent() check and rejects messages from any
          // other window that happens to hold a reference to the iframe.
          if (event.source !== window.parent) return;

          const data = event.data;
          const isObj = typeof data === 'object' && data !== null && !Array.isArray(data);
          if (!isObj) return;

          const hashMatch = typeof data.hash === 'string' ? commentHashPattern.exec(data.hash) : null;
          if (hashMatch) {
            // Reconstruct the fragment from a strict comment-id alphabet and
            // URL-encode the captured value before it reaches a navigation API.
            const safeCommentId = encodeURIComponent(hashMatch[1]);
            location.replace('#remark42__comment-' + safeCommentId);
          }

          if (typeof data.title === 'string') {
            document.title = data.title.slice(0, 512);
          }
        } catch (e) {}
      });

      var remark_config =
        window.location.search.length < 2
          ? {}
          : window.location.search
              .substring(1)
              .split('&')
              .reduce(function (c, x) {
                var splitted = x.split('=');
                if (!splitted[1]) {
                  splitted[1] = '';
                }
                c[splitted[0]] = decodeURIComponent(splitted[1]);
                return c;
              }, {});

      window.parent.postMessage({ inited: true }, '*');
    </script>
    <script>
      (function () {
        'use strict';

        function removeInput(input) {
          if (!input) return;
          var label = input.closest && input.closest('label');
          (label || input).remove();
        }

        function removeUploadControls(root) {
          if (!root) return;
          if (root.matches && root.matches("input[type='file']")) removeInput(root);
          if (!root.querySelectorAll) return;
          root.querySelectorAll("input[type='file']").forEach(removeInput);
        }

        function containsImageTransfer(event) {
          var transfer = event.clipboardData || event.dataTransfer;
          if (!transfer) return false;

          if (transfer.files) {
            for (var i = 0; i < transfer.files.length; i++) {
              if ((transfer.files[i].type || '').indexOf('image/') === 0) return true;
            }
          }

          if (transfer.items) {
            for (var j = 0; j < transfer.items.length; j++) {
              var item = transfer.items[j];
              if (item.kind === 'file' && (item.type || '').indexOf('image/') === 0) return true;
            }
          }

          return false;
        }

        function blockImageTransfer(event) {
          if (!containsImageTransfer(event)) return;
          event.preventDefault();
          event.stopImmediatePropagation();
        }

        document.addEventListener('paste', blockImageTransfer, true);
        document.addEventListener('drop', blockImageTransfer, true);
        document.addEventListener('dragover', blockImageTransfer, true);

        function startGuard() {
          removeUploadControls(document);
          var observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
              mutation.addedNodes.forEach(function (node) {
                if (node.nodeType === 1) removeUploadControls(node);
              });
            });
          });
          observer.observe(document.body, { childList: true, subtree: true });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', startGuard, { once: true });
        } else {
          startGuard();
        }
      })();
    </script>
    <script>
      (function () {
        'use strict';

        var commentIdPrefix = 'remark42__comment-';
        var base62Alphabet = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
        var maxFiveCharacterBase62 = 916132832; // 62^5
        var identityByComment = new Map();
        var identityRequest = null;

        function hashRemarkUserId(userId) {
          // FNV-1a is used only to make a compact opaque display identifier. It
          // is not a security primitive and the raw Remark42 user id is never
          // inserted into the rendered DOM.
          var hash = 0x811c9dc5;
          for (var i = 0; i < userId.length; i++) {
            hash ^= userId.charCodeAt(i);
            hash = Math.imul(hash, 0x01000193);
          }
          return hash >>> 0;
        }

        function encodeFiveCharacterUid(value) {
          var encoded = '';
          for (var i = 0; i < 5; i++) {
            encoded = base62Alphabet[value % 62] + encoded;
            value = Math.floor(value / 62);
          }
          return encoded;
        }

        function deriveDisplayUid(userId) {
          if (typeof userId !== 'string' || !userId) return null;
          return encodeFiveCharacterUid(hashRemarkUserId(userId) % maxFiveCharacterBase62);
        }

        function roleForUser(user) {
          if (user && user.admin === true) return 'Staff';
          if (user && typeof user.id === 'string' && user.id.indexOf('anonymous_') === 0) return 'Guest';
          return 'Reader';
        }

        function buildIdentityIndex(comments) {
          var next = new Map();
          var uidOwner = Object.create(null);
          var uidByUser = Object.create(null);
          var collided = Object.create(null);

          for (var i = 0; i < comments.length; i++) {
            var comment = comments[i];
            if (!comment || typeof comment.id !== 'string' || !comment.user || typeof comment.user.id !== 'string') {
              continue;
            }

            var userId = comment.user.id;
            var uid = uidByUser[userId] || deriveDisplayUid(userId);
            if (!uid) continue;
            uidByUser[userId] = uid;

            if (uidOwner[uid] && uidOwner[uid] !== userId) {
              collided[uid] = true;
            } else {
              uidOwner[uid] = userId;
            }
          }

          for (var j = 0; j < comments.length; j++) {
            var item = comments[j];
            if (!item || typeof item.id !== 'string' || !item.user || typeof item.user.id !== 'string') continue;
            var candidate = uidByUser[item.user.id] || null;
            next.set(item.id, {
              uid: candidate && !collided[candidate] ? candidate : null,
              role: roleForUser(item.user),
              name: typeof item.user.name === 'string' ? item.user.name : ''
            });
          }

          identityByComment = next;

          var collisionKeys = Object.keys(collided);
          if (collisionKeys.length > 0) {
            console.warn('[VISCERIUM] Withheld colliding five-character comment UIDs:', collisionKeys.join(', '));
          }
        }

        function identityEndpoint() {
          if (!remark_config.site_id || !remark_config.url) return null;
          var query = new URLSearchParams();
          query.set('site', remark_config.site_id);
          query.set('url', remark_config.url);
          query.set('format', 'plain');
          return '/api/v1/find?' + query.toString();
        }

        function findOwnTimeAnchor(info, articleId) {
          if (!info || !info.children) return null;
          for (var i = 0; i < info.children.length; i++) {
            var child = info.children[i];
            if (child.tagName !== 'A') continue;
            try {
              if (new URL(child.href, window.location.href).hash === '#' + articleId) return child;
            } catch (e) {}
          }
          return null;
        }

        function findHeaderParts(article, identity) {
          if (!article || !article.children) return null;

          for (var i = 0; i < article.children.length; i++) {
            var info = article.children[i];
            if (!info || info.tagName !== 'DIV') continue;

            var time = findOwnTimeAnchor(info, article.id);
            if (!time) continue;

            for (var j = 0; j < info.children.length; j++) {
              var candidate = info.children[j];
              if (!candidate || candidate.tagName !== 'DIV') continue;
              var buttons = candidate.querySelectorAll('button');
              for (var k = 0; k < buttons.length; k++) {
                if ((buttons[k].textContent || '').trim() === identity.name) {
                  return { user: candidate, time: time };
                }
              }
            }
          }

          return null;
        }

        function decorateComment(article) {
          if (!article || typeof article.id !== 'string' || article.id.indexOf(commentIdPrefix) !== 0) return;
          var commentId = article.id.substring(commentIdPrefix.length);
          var identity = identityByComment.get(commentId);
          if (!identity) return;

          var parts = findHeaderParts(article, identity);
          if (!parts) return;

          var metaText = identity.uid
            ? identity.uid + (identity.role ? ' · ' + identity.role : '')
            : identity.role || '';

          if (!metaText) return;

          if (parts.user.getAttribute('data-vc-meta') !== metaText) {
            parts.user.setAttribute('data-vc-meta', metaText);
          }
          var roleValue = (identity.role || '').toLowerCase();
          if (parts.user.getAttribute('data-vc-role') !== roleValue) {
            parts.user.setAttribute('data-vc-role', roleValue);
          }
          if (!parts.time.hasAttribute('data-vc-time')) {
            parts.time.setAttribute('data-vc-time', '');
          }
        }

        function decorateComments(root) {
          if (!root || !root.querySelectorAll) return;
          var comments = root.querySelectorAll("article[id^='remark42__comment-']");
          for (var i = 0; i < comments.length; i++) decorateComment(comments[i]);
        }

        function scheduleDecorationBurst() {
          [0, 80, 250].forEach(function (delay) {
            window.setTimeout(function () {
              decorateComments(document);
            }, delay);
          });
        }

        function scheduleInitialDecoration() {
          [0, 50, 150, 300, 600, 1000, 1600, 2500].forEach(function (delay) {
            window.setTimeout(function () {
              decorateComments(document);
            }, delay);
          });
        }

        function refreshIdentityIndex() {
          var endpoint = identityEndpoint();
          if (!endpoint) return Promise.resolve();
          if (identityRequest) return identityRequest;

          identityRequest = fetch(endpoint, {
            method: 'GET',
            credentials: 'same-origin',
            headers: { Accept: 'application/json' }
          })
            .then(function (response) {
              if (!response.ok) throw new Error('identity request returned ' + response.status);
              return response.json();
            })
            .then(function (payload) {
              if (!payload || !Array.isArray(payload.comments)) {
                throw new Error('identity response did not contain comments');
              }
              buildIdentityIndex(payload.comments);
              scheduleInitialDecoration();
            })
            .catch(function (error) {
              console.warn('[VISCERIUM] Comment identity metadata unavailable:', error);
            })
            .finally(function () {
              identityRequest = null;
            });

          return identityRequest;
        }

        function scheduleRefreshAfterSubmit() {
          window.setTimeout(refreshIdentityIndex, 600);
          window.setTimeout(refreshIdentityIndex, 1800);
        }

        document.addEventListener('submit', scheduleRefreshAfterSubmit, true);
        document.addEventListener('click', scheduleDecorationBurst, true);

        window.addEventListener('message', function refreshIdentityAfterParentUpdate(event) {
          if (event.source !== window.parent) return;
          var data = event.data;
          if (!data || typeof data !== 'object' || Array.isArray(data)) return;
          if (data.theme === 'light' || data.theme === 'dark') scheduleDecorationBurst();
        });

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', refreshIdentityIndex, { once: true });
        } else {
          refreshIdentityIndex();
        }
      })();
    </script>
    <script>
      (function (d) {
        var r = d.head || d.body;
        var s = d.createElement('script');
        var m = 'noModule' in s;
        s.src = 'remark' + (m ? '.mjs' : '.js');
        m && (s.type = 'module');
        s.async = true;
        s.defer = true;
        r.appendChild(s);
      })(document);
    </script>
  </body>
</html>
