<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="modulepreload" href="remark.mjs" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Comments</title>
    <base target="_blank" />
    <!--
      Based on Remark42 v1.16.4's production iframe template (MIT).
      VISCERIUM keeps the stock Remark42 JS/CSS and adds only a reviewed
      no-upload guard, colour remap, top-level prompt, and post-render identity
      decoration. Keep this shell version-pinned and review it on every Remark42
      upgrade.
    -->
    <style>
      /* The backend and Caddy remain the security boundary for image uploads. */
      label:has(input[type='file']) {
        display: none !important;
      }

      /*
        Keep Remark42's palette architecture intact. Upstream defines the
        numbered --color* tokens once on :root and lets its own light/dark
        component classes choose between them. VISCERIUM follows that contract:
        neutral tokens never swap meaning when the theme changes. Only named
        theme variables and era accent tokens vary under Remark42's literal
        direct-child .dark/.light root.
      */
      html:root {
        /* Stable neutral ramp: dark ink/surfaces through warm light surfaces. */
        --color0: #101010;
        --color8: #211f1b;
        --color22: #2a2824;
        --color24: #302d28;
        --color7: #484137;
        --color23: #39342f;
        --color18: #38342e;
        --color19: #403a33;
        --color36: #575047;
        --color34: #555047;
        --color37: #6b6459;
        --color14: #6a645a;
        --color10: #777064;
        --color13: #888070;
        --color11: #968f80;
        --color32: #a6a093;
        --color1: #aaa395;
        --color35: #d1c8b5;
        --color20: #c8bfa8;
        --color41: #efe6d2;
        --color5: #c8bfa8;
        --color6: #b9b4a9;
        --color3: #a8a192;
        --color4: #b1aa9c;
        --color16: #9b9384;
        --color31: #7e776a;
        --color21: #c1baa9;

        /* Error states keep their semantic role in both themes. */
        --color28: #6e2630;
        --color25: #7a0019;
        --color38: #b31435;
        --color27: #ff8a9a;
        --color26: #e1a6ac;
      }

      #remark42 > .dark {
        --vc-meta: #888070;
        --vc-staff-text: #000;
        --vc-era-accent: #888070;
        --vc-era-high: #c8bfa8;
        --vc-era-soft: #484137;
        --vc-era-button: #484137;
        --vc-era-accent-rgb: 136, 128, 112;
        --vc-era-high-rgb: 200, 191, 168;

        --primary-color: var(--vc-era-accent-rgb);
        --primary-brighter-color: var(--vc-era-high-rgb);
        --primary-darker-color: var(--vc-era-accent-rgb);
        --primary-text-color: 200, 191, 168;
        --secondary-text-color: 136, 128, 112;
        --secondary-darker-text-color: 136, 128, 112;
        --primary-background-color: 16, 16, 16;
        --text-color: 200, 191, 168;
        --error-color: #ff8a9a;
        --error-background: #6e2630;
        --line-color: var(--color36);
        --line-brighter-color: var(--color11);
      }

      #remark42 > .light {
        --vc-meta: #403b34;
        --vc-staff-text: #c8bfa8;
        --vc-era-accent: #484137;
        --vc-era-high: #101010;
        --vc-era-soft: #b1aa9c;
        --vc-era-button: #484137;
        --vc-era-accent-rgb: 72, 65, 55;
        --vc-era-high-rgb: 16, 16, 16;

        --primary-color: var(--vc-era-accent-rgb);
        --primary-brighter-color: var(--vc-era-high-rgb);
        --primary-darker-color: var(--vc-era-accent-rgb);
        --primary-text-color: 21, 21, 21;
        --secondary-text-color: 95, 89, 78;
        --secondary-darker-text-color: 95, 89, 78;
        --primary-background-color: 185, 180, 169;
        --text-color: 16, 16, 16;
        --error-color: #7a0019;
        --error-background: #e1a6ac;
        --line-color: var(--color16);
        --line-brighter-color: var(--color31);
      }

      html[data-viscerium-era='e1'] #remark42 > .dark {
        --vc-era-accent: #b56873;
        --vc-era-high: #f83b52;
        --vc-era-soft: #6e141f;
        --vc-era-button: #974e59;
        --vc-era-accent-rgb: 181, 104, 115;
        --vc-era-high-rgb: 248, 59, 82;
      }

      html[data-viscerium-era='e1'] #remark42 > .light {
        --vc-era-accent: #7b0f2f;
        --vc-era-high: #62000c;
        --vc-era-soft: #e5a4a3;
        --vc-era-button: #5f1b2a;
        --vc-era-accent-rgb: 123, 15, 47;
        --vc-era-high-rgb: 98, 0, 12;
      }

      html[data-viscerium-era='e2'] #remark42 > .dark {
        --vc-era-accent: #7d8250;
        --vc-era-high: #7f8d00;
        --vc-era-soft: #555d19;
        --vc-era-button: #5f6900;
        --vc-era-accent-rgb: 125, 130, 80;
        --vc-era-high-rgb: 127, 141, 0;
      }

      html[data-viscerium-era='e2'] #remark42 > .light {
        --vc-era-accent: #444700;
        --vc-era-high: #2c3300;
        --vc-era-soft: #b5bc93;
        --vc-era-button: #313700;
        --vc-era-accent-rgb: 68, 71, 0;
        --vc-era-high-rgb: 44, 51, 0;
      }

      html[data-viscerium-era='e3'] #remark42 > .dark {
        --vc-era-accent: #b2668d;
        --vc-era-high: #eb4684;
        --vc-era-soft: #5d0f2f;
        --vc-era-button: #954b72;
        --vc-era-accent-rgb: 178, 102, 141;
        --vc-era-high-rgb: 235, 70, 132;
      }

      html[data-viscerium-era='e3'] #remark42 > .light {
        --vc-era-accent: #73144e;
        --vc-era-high: #5f0028;
        --vc-era-soft: #dfa5b4;
        --vc-era-button: #5d1840;
        --vc-era-accent-rgb: 115, 20, 78;
        --vc-era-high-rgb: 95, 0, 40;
      }

      html[data-viscerium-era='e4'] #remark42 > .dark {
        --vc-era-accent: #568786;
        --vc-era-high: #009688;
        --vc-era-soft: #1b6860;
        --vc-era-button: #756047;
        --vc-era-accent-rgb: 86, 135, 134;
        --vc-era-high-rgb: 0, 150, 136;
      }

      html[data-viscerium-era='e4'] #remark42 > .light {
        --vc-era-accent: #004849;
        --vc-era-high: #00342e;
        --vc-era-soft: #96c2bb;
        --vc-era-button: #433018;
        --vc-era-accent-rgb: 0, 72, 73;
        --vc-era-high-rgb: 0, 52, 46;
      }

      /* Accent tokens may vary by era/theme; neutral surface/text tokens above do not. */
      #remark42 > .dark,
      #remark42 > .light {
        --color29: var(--vc-era-accent);
        --color9: var(--vc-era-accent);
        --color15: var(--vc-era-button);
        --color33: var(--vc-era-high);
        --color40: var(--vc-era-accent);
        --color43: var(--vc-era-soft);
        --color42: var(--vc-era-soft);
        --color48: rgba(var(--vc-era-accent-rgb), 0.6);
        --color47: rgba(var(--vc-era-accent-rgb), 0.4);
      }

      /* VISCERIUM-owned structure stays outside the native composer controls. */
      article[id^='remark42__comment-'] {
        border-left: 2px solid var(--vc-era-accent);
        padding-left: 12px;
      }

      img.avatar {
        border: 0 !important;
        box-shadow: none !important;
      }

      .vc-comment-identity {
        display: flex;
        flex: 0 0 100%;
        align-items: center;
        gap: 6px;
        min-height: 13px;
        margin-top: 2px;
        margin-left: 32px;
        color: var(--vc-meta);
        font-size: 10px;
        line-height: 1.2;
      }

      .vc-comment-uid {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 9px;
        letter-spacing: 0.08em;
        user-select: all;
      }

      .vc-comment-separator {
        opacity: 0.75;
      }

      .vc-comment-role {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .vc-comment-role[data-role='staff'] {
        padding: 2px 5px;
        border-radius: 4px;
        background: var(--vc-era-accent);
        color: var(--vc-staff-text);
        letter-spacing: 0.075em;
      }
    </style>
    <script>
      if (window.location.search === '?selfClose') {
        window.close();
      }
      (function () {
        try {
          var pairs = window.location.search.substring(1).split('&');
          var theme = '';

          for (var i = 0; i < pairs.length; i++) {
            var pair = pairs[i].split('=');
            if (pair[0] === 'theme') {
              theme = decodeURIComponent(pair[1] || '');
              break;
            }
          }

          document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
        } catch (e) {}
      })();
      (function () {
        function isCSSVariablesSupported() {
          if (typeof window === 'undefined') {
            return true;
          }

          return window.CSS && window.CSS.supports && window.CSS.supports('color', 'var(--fake-var)');
        }
        if (isCSSVariablesSupported()) {
          try {
            var name = JSON.parse(window.name);
            var colors = name.__colors__;
            var root = document.documentElement;
            if (colors) {
              for (var color in colors) {
                if (!color.startsWith('--')) {
                  console.info('Key ' + color + ' must start with `--`');
                  continue;
                }
                root.style.setProperty(color, colors[color]);
              }
            }
          } catch (e) {}
        }
      })();
    </script>
    <link rel="stylesheet" href="remark.css" />
  </head>
  <body>
    <div id="remark42">
      <div class="preloader preloader_view_iframe"></div>
    </div>
    <script>
      var commentHashPattern = /^#remark42__comment-([A-Za-z0-9_-]{1,128})$/;

      window.addEventListener('message', function receiveMessages(event) {
        try {
          if (event.source !== window.parent) return;

          const data = event.data;
          const isObj = typeof data === 'object' && data !== null && !Array.isArray(data);
          if (!isObj) return;

          const hashMatch = typeof data.hash === 'string' ? commentHashPattern.exec(data.hash) : null;
          if (hashMatch) {
            const safeCommentId = encodeURIComponent(hashMatch[1]);
            location.replace('#remark42__comment-' + safeCommentId);
          }

          if (typeof data.title === 'string') {
            document.title = data.title.slice(0, 512);
          }
        } catch (e) {}
      });

      var remark_config =
        window.location.search.length < 2
          ? {}
          : window.location.search
              .substring(1)
              .split('&')
              .reduce(function (c, x) {
                var splitted = x.split('=');
                if (!splitted[1]) {
                  splitted[1] = '';
                }
                c[splitted[0]] = decodeURIComponent(splitted[1]);
                return c;
              }, {});

      (function inferVisceriumEra() {
        try {
          var pathname = new URL(remark_config.url || '', window.location.href).pathname.toLowerCase();
          var era = '';
          if (pathname.indexOf('/eras/citadel/') !== -1) era = 'e1';
          else if (pathname.indexOf('/eras/smog/') !== -1) era = 'e2';
          else if (pathname.indexOf('/eras/nearsight/') !== -1) era = 'e3';
          else if (pathname.indexOf('/eras/entropy/') !== -1) era = 'e4';
          if (era) document.documentElement.dataset.visceriumEra = era;
        } catch (e) {}
      })();

      window.parent.postMessage({ inited: true }, '*');
    </script>
    <script>
      (function () {
        'use strict';

        var prompts = [
          'What was your favourite part of this article?',
          'What would you like to see more of from this article?',
          'What detail stood out to you most?',
          'Was anything unclear or underdeveloped?',
          'What would you like to know more about?',
          'What did we miss?',
          'Which part of this article stayed with you?',
          'What should this article explore next?',
          'Did anything here leave you with questions?',
          'What detail should we explore further?'
        ];
        var selectedPrompt = prompts[Math.floor(Math.random() * prompts.length)];
        var base62Alphabet = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
        var maxFiveCharacterBase62 = 916132832; // 62^5

        function removeInput(input) {
          if (!input) return;
          var label = input.closest && input.closest('label');
          (label || input).remove();
        }

        function removeUploadControls(root) {
          if (!root) return;
          if (root.matches && root.matches("input[type='file']")) removeInput(root);
          if (!root.querySelectorAll) return;
          root.querySelectorAll("input[type='file']").forEach(removeInput);
        }

        function containsImageTransfer(event) {
          var transfer = event.clipboardData || event.dataTransfer;
          if (!transfer) return false;

          if (transfer.files) {
            for (var i = 0; i < transfer.files.length; i++) {
              if ((transfer.files[i].type || '').indexOf('image/') === 0) return true;
            }
          }

          if (transfer.items) {
            for (var j = 0; j < transfer.items.length; j++) {
              var item = transfer.items[j];
              if (item.kind === 'file' && (item.type || '').indexOf('image/') === 0) return true;
            }
          }

          return false;
        }

        function blockImageTransfer(event) {
          if (!containsImageTransfer(event)) return;
          event.preventDefault();
          event.stopImmediatePropagation();
        }

        function maybeApplyPrompt(form, expected) {
          if (!form || form.getAttribute('data-testid') !== expected) return false;
          var textarea = form.querySelector('textarea');
          if (!textarea) return false;
          if (textarea.getAttribute('placeholder') !== selectedPrompt) {
            textarea.setAttribute('placeholder', selectedPrompt);
          }
          return true;
        }

        function applyMainPrompt(root) {
          if (!root) return;
          var expected = 'commentform_' + encodeURI(remark_config.url || '');
          if (root.matches && root.matches('form[data-testid]') && maybeApplyPrompt(root, expected)) return;
          if (!root.querySelectorAll) return;
          var forms = root.querySelectorAll('form[data-testid]');
          for (var i = 0; i < forms.length; i++) {
            if (maybeApplyPrompt(forms[i], expected)) return;
          }
        }

        function encodeFiveCharacterUid(id) {
          if (!Number.isSafeInteger(id) || id < 0 || id >= maxFiveCharacterBase62) return null;
          var encoded = '';
          do {
            encoded = base62Alphabet[id % 62] + encoded;
            id = Math.floor(id / 62);
          } while (id > 0);
          while (encoded.length < 5) encoded = '0' + encoded;
          return encoded;
        }

        function githubUidFromAvatar(url) {
          var match = /^https:\/\/avatars\.githubusercontent\.com\/u\/(\d+)(?:[/?#]|$)/i.exec(url || '');
          if (!match) return null;
          return encodeFiveCharacterUid(Number(match[1]));
        }

        function isStaffComment(article) {
          for (var i = 0; i < article.classList.length; i++) {
            if (article.classList[i].toLowerCase().indexOf('viewadmin') !== -1) return true;
          }
          return false;
        }

        function decorateComment(article) {
          if (!article || article.querySelector('.vc-comment-identity')) return;

          var avatar = article.querySelector('img.avatar');
          var uid = avatar ? githubUidFromAvatar(avatar.src) : null;
          var isStaff = isStaffComment(article);
          var role = isStaff ? 'Staff' : uid ? 'Reader' : null;

          /*
            Do not infer Guest/non-GitHub roles from username or avatar shape.
            Remark42's rendered comment DOM does not expose provider/user.id.
            Unsupported providers stay undecorated until a stable identity source
            is deliberately added.
          */
          if (!uid && !role) return;

          var directChildren = article.children;
          var info = null;
          for (var i = 0; i < directChildren.length; i++) {
            if (directChildren[i].querySelector && directChildren[i].querySelector('img.avatar')) {
              info = directChildren[i];
              break;
            }
          }
          if (!info) return;

          var identity = document.createElement('span');
          identity.className = 'vc-comment-identity';

          if (uid) {
            var uidNode = document.createElement('span');
            uidNode.className = 'vc-comment-uid';
            uidNode.textContent = uid;
            uidNode.title = 'VISCERIUM user ID';
            identity.appendChild(uidNode);

            if (role) {
              var separator = document.createElement('span');
              separator.className = 'vc-comment-separator';
              separator.textContent = '·';
              separator.setAttribute('aria-hidden', 'true');
              identity.appendChild(separator);
            }
          }

          if (role) {
            var roleNode = document.createElement('span');
            roleNode.className = 'vc-comment-role';
            roleNode.dataset.role = role.toLowerCase();
            roleNode.textContent = role;
            identity.appendChild(roleNode);
          }

          info.appendChild(identity);
        }

        function decorateComments(root) {
          if (!root || !root.querySelectorAll) return;
          if (root.matches && root.matches("article[id^='remark42__comment-']")) decorateComment(root);
          var comments = root.querySelectorAll("article[id^='remark42__comment-']");
          for (var i = 0; i < comments.length; i++) decorateComment(comments[i]);
        }

        function refreshDecorations() {
          removeUploadControls(document);
          applyMainPrompt(document);
          decorateComments(document);
        }

        var refreshFrame = 0;

        function scheduleRefresh(delay) {
          if (delay && delay > 0) {
            window.setTimeout(function () { scheduleRefresh(0); }, delay);
            return;
          }
          if (refreshFrame) return;
          refreshFrame = window.requestAnimationFrame(function () {
            refreshFrame = 0;
            refreshDecorations();
          });
        }

        function waitForInitialRender(attempt) {
          refreshDecorations();

          var expected = 'commentform_' + encodeURI(remark_config.url || '');
          var forms = document.querySelectorAll('form[data-testid]');
          var mainForm = null;
          for (var i = 0; i < forms.length; i++) {
            if (forms[i].getAttribute('data-testid') === expected) {
              mainForm = forms[i];
              break;
            }
          }
          var stillLoading = document.querySelector('#remark42 .preloader');
          if ((mainForm && !stillLoading) || attempt >= 7) return;

          var delays = [50, 100, 200, 400, 800, 1600, 3200, 5000];
          window.setTimeout(function () { waitForInitialRender(attempt + 1); }, delays[attempt] || 5000);
        }

        document.addEventListener('paste', blockImageTransfer, true);
        document.addEventListener('drop', blockImageTransfer, true);
        document.addEventListener('dragover', blockImageTransfer, true);

        function startGuard() {
          // No persistent DOM observer is installed. Remark42's controlled
          // textarea re-renders on every keystroke, so any subtree observer can
          // enter the editor hot path even when it watches childList only.
          waitForInitialRender(0);

          // Low-frequency actions that can create reply/edit forms or comments
          // schedule bounded passes. Typing/focus never enter this path.
          document.addEventListener('submit', function () {
            scheduleRefresh(250);
            scheduleRefresh(1000);
          }, true);
          document.addEventListener('click', function () { scheduleRefresh(0); }, true);

          // Theme changes are an explicit Remark42 message, not inferred from DOM
          // mutations. Refresh once after Preact applies the new theme so any
          // externally-added identity node removed by reconciliation is restored.
          window.addEventListener('message', function (event) {
            if (event.source !== window.parent) return;
            var data = event.data;
            if (!data || typeof data !== 'object') return;
            if (data.theme === 'dark' || data.theme === 'light') scheduleRefresh(0);
          });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', startGuard, { once: true });
        } else {
          startGuard();
        }
      })();
    </script>
    <script>
      (function (d) {
        var r = d.head || d.body;
        var s = d.createElement('script');
        var m = 'noModule' in s;
        s.src = 'remark' + (m ? '.mjs' : '.js');
        m && (s.type = 'module');
        s.async = true;
        s.defer = true;
        r.appendChild(s);
      })(document);
    </script>
  </body>
</html>
