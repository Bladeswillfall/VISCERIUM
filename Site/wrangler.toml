[secrets]
required = ["KUDOS_HMAC_KEY"]

[[d1_databases]]
binding = "DB"
database_name = "viscerium-community-preview"
database_id = "b835e74b-3388-4dcb-bb88-3440892ab61d"
preview_database_id = "DB"

[vars]
NODE_VERSION = "24"

[env.production.secrets]
required = ["KUDOS_HMAC_KEY"]

