name: Temporary PR 104 notice migration

on:
  push:
    branches:
      - scratch/pr104-eslint-lock

permissions:
  contents: write

jobs:
  notices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Use repository npm version
        run: |
          npm install --global npm@11.18.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.18.0"

      - name: Install locked dependencies
        working-directory: Site
        run: npm ci --silent --no-audit --no-fund

      - name: Update managed notices
        working-directory: Site
        run: npm run notices:update

      - name: Add ESLint human attribution
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'THIRD_PARTY_NOTICES.md';
          let text = fs.readFileSync(file, 'utf8');
          const row = '| [ESLint](https://github.com/eslint/eslint) (`eslint`) | Cyclomatic-complexity checks for repository JavaScript | MIT |';
          if (!text.includes(row)) {
            const anchor = '| [Playwright](https://github.com/microsoft/playwright) (`@playwright/test`) | Browser and interface testing | Apache-2.0 |';
            if (!text.includes(anchor)) throw new Error('Playwright attribution anchor not found');
            text = text.replace(anchor, `${anchor}\n${row}`);
            fs.writeFileSync(file, text);
          }
          NODE

      - name: Verify notices
        working-directory: Site
        run: |
          npm run notices:check
          node --test tests/third-party-notices.test.mjs

      - name: Commit notice update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add THIRD_PARTY_NOTICES.md
          if git diff --cached --quiet; then
            echo "No notice changes."
            exit 0
          fi
          git commit -m "docs: attribute ESLint dependency"
          git push origin HEAD:scratch/pr104-eslint-lock
