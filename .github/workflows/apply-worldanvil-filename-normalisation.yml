name: Apply World Anvil filename normalisation

on:
  push:
    branches:
      - codex/normalise-worldanvil-filenames
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'codex/normalise-worldanvil-filenames')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: codex/normalise-worldanvil-filenames
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json

      - name: Install dependencies
        working-directory: Site
        run: npm ci --silent --no-audit --no-fund

      - name: Rename filed World Anvil notes
        working-directory: Site
        run: npm run migration:worldanvil:filenames:write -- --allow-collisions

      - name: Run unit tests
        working-directory: Site
        run: npm run test:unit

      - name: Remove one-off workflow and commit results
        run: |
          rm .github/workflows/apply-worldanvil-filename-normalisation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No filename changes were required."
            exit 0
          fi
          git commit -m "Normalise migrated lore filenames [skip ci]"
          git push origin HEAD:codex/normalise-worldanvil-filenames
