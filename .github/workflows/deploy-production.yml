name: Direct production deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_DIRECT_DEPLOY == '1' }}
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: Site
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json

      - name: Use npm with lifecycle-script policy support
        working-directory: .
        run: |
          npm install --global npm@11.18.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.18.0"

      - run: npm ci --silent --no-audit --no-fund

      - name: Fingerprint Atlas map definitions
        id: atlas_maps
        run: node scripts/map-cache-key.mjs >> "$GITHUB_OUTPUT"

      - name: Restore Atlas tile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Site/node_modules/.astro/viscerium/map-tiles
          key: atlas-tiles-v1-${{ runner.os }}-${{ steps.atlas_maps.outputs.fingerprint }}-${{ hashFiles('Site/scripts/lib/map-tile-cache.mjs', 'Site/scripts/map-cache-key.mjs', 'Site/scripts/generate-map-tiles.mjs', 'Site/package-lock.json', 'Vault/Assets/Maps/**/*.webp', 'Vault/maps/**/*.webp', 'Site/public/assets/maps/**/*.webp') }}
          restore-keys: |
            atlas-tiles-v1-${{ runner.os }}-

      - name: Restore responsive variant cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Site/node_modules/.astro/viscerium/image-variants
          key: responsive-variants-v1-${{ runner.os }}-${{ hashFiles('Site/scripts/generate-image-variants.mjs', 'Site/scripts/lib/responsive-image-cache.mjs', 'Site/scripts/sync-public-notes.mjs', 'Site/package-lock.json', 'Vault/Assets/**/*.webp', 'Vault/Lore/**/*.md', 'Vault/Lore/**/*.mdx') }}
          restore-keys: |
            responsive-variants-v1-${{ runner.os }}-

      - name: Restore production Astro incremental build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Site/node_modules/.astro/incremental-build.json
            Site/node_modules/.astro/dist
          key: astro-production-v1-${{ runner.os }}-${{ hashFiles('Site/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            astro-production-v1-${{ runner.os }}-${{ hashFiles('Site/package-lock.json') }}-

      - name: Build production artifact
        env:
          CF_PAGES: '1'
          PUBLIC_CONTACT_FORM_ENABLED: '1'
          PUBLIC_CONTACT_FORM_ENDPOINT: 'https://viscerium-site-services.bladeswillfall.workers.dev/contact'
          PUBLIC_RYBBIT_ENABLED: '1'
          PUBLIC_RYBBIT_HOST: 'https://analytics.viscerium.co.uk'
          PUBLIC_RYBBIT_SITE_ID: 'd863318efa2f'
          PUBLIC_TURNSTILE_SITE_KEY: '0x4AAAAAADyoq-9zwp5ep4hG'
        run: npm run build

      - name: Deploy tested production artifact
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: Site
          packageManager: npm
          wranglerVersion: '4.136.3'
          command: pages deploy dist --project-name=viscerium-site --branch=main --commit-hash=${{ github.sha }}
