name: Responsive cache benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/benchmark-responsive-cache.yml
      - .github/scripts/report-responsive-cache-benchmark.mjs
      - .github/scripts/report-responsive-cache-benchmark.test.mjs

permissions:
  contents: read

jobs:
  cold:
    name: Generate responsive cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      build_ms: ${{ steps.cold_build.outputs.ms }}
      entries: ${{ steps.cold_build.outputs.entries }}
      bytes: ${{ steps.cold_build.outputs.bytes }}
      atlas_hit: ${{ steps.atlas.outputs.cache-hit }}
      atlas_key: ${{ steps.atlas.outputs.cache-matched-key }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json
      - name: Use repository npm version
        run: |
          npm install --global npm@11.18.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.18.0"
      - name: Check benchmark report
        run: node --test .github/scripts/report-responsive-cache-benchmark.test.mjs
      - name: Install site dependencies
        working-directory: Site
        run: npm ci --silent --no-audit --no-fund
      - name: Fingerprint Atlas maps
        id: atlas_maps
        working-directory: Site
        run: node scripts/map-cache-key.mjs >> "$GITHUB_OUTPUT"
      - name: Restore Atlas tile cache without saving
        id: atlas
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Site/node_modules/.astro/viscerium/map-tiles
          key: atlas-tiles-v1-${{ runner.os }}-${{ steps.atlas_maps.outputs.fingerprint }}-${{ hashFiles('Site/scripts/lib/map-tile-cache.mjs', 'Site/scripts/map-cache-key.mjs', 'Site/scripts/generate-map-tiles.mjs', 'Site/package-lock.json', 'Vault/Assets/Maps/**/*.webp', 'Site/public/assets/maps/**/*.webp') }}
          restore-keys: |
            atlas-tiles-v1-${{ runner.os }}-
      - name: Time cold production build
        id: cold_build
        working-directory: Site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules/.astro/viscerium/image-variants
          start=$(date +%s%3N)
          npm run build
          elapsed=$(($(date +%s%3N) - start))
          entries=$(find node_modules/.astro/viscerium/image-variants -name manifest.json -type f | wc -l)
          bytes=$(du -sb node_modules/.astro/viscerium/image-variants | cut -f1)
          test "$elapsed" -gt 0
          test "$entries" -gt 0
          test "$bytes" -gt 0
          {
            echo "ms=$elapsed"
            echo "entries=$entries"
            echo "bytes=$bytes"
          } >> "$GITHUB_OUTPUT"
      - name: Save only this run's responsive cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Site/node_modules/.astro/viscerium/image-variants
          key: responsive-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

  warm:
    name: Restore responsive cache
    needs: cold
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json
      - name: Use repository npm version
        run: |
          npm install --global npm@11.18.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.18.0"
      - name: Install site dependencies
        working-directory: Site
        run: npm ci --silent --no-audit --no-fund
      - name: Fingerprint Atlas maps
        id: atlas_maps
        working-directory: Site
        run: node scripts/map-cache-key.mjs >> "$GITHUB_OUTPUT"
      - name: Restore Atlas tile cache without saving
        id: atlas
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Site/node_modules/.astro/viscerium/map-tiles
          key: atlas-tiles-v1-${{ runner.os }}-${{ steps.atlas_maps.outputs.fingerprint }}-${{ hashFiles('Site/scripts/lib/map-tile-cache.mjs', 'Site/scripts/map-cache-key.mjs', 'Site/scripts/generate-map-tiles.mjs', 'Site/package-lock.json', 'Vault/Assets/Maps/**/*.webp', 'Site/public/assets/maps/**/*.webp') }}
          restore-keys: |
            atlas-tiles-v1-${{ runner.os }}-
      - name: Start measuring real cache restoration
        id: restore_start
        run: echo "ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"
      - name: Restore benchmark cache from cold job
        id: responsive
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Site/node_modules/.astro/viscerium/image-variants
          key: responsive-benchmark-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Measure restoration time
        id: restore_time
        run: |
          elapsed=$(($(date +%s%3N) - ${{ steps.restore_start.outputs.ms }}))
          test "$elapsed" -ge 0
          echo "ms=$elapsed" >> "$GITHUB_OUTPUT"
      - name: Time warm production build
        id: warm_build
        working-directory: Site
        shell: bash
        run: |
          set -euo pipefail
          before=$(find node_modules/.astro/viscerium/image-variants -name manifest.json -type f | wc -l)
          test "$before" -eq "${{ needs.cold.outputs.entries }}"
          before_state=$(find node_modules/.astro/viscerium/image-variants -name manifest.json -type f -printf "%P %T@ %s\\n" | LC_ALL=C sort)
          start=$(date +%s%3N)
          npm run build
          elapsed=$(($(date +%s%3N) - start))
          entries=$(find node_modules/.astro/viscerium/image-variants -name manifest.json -type f | wc -l)
          after_state=$(find node_modules/.astro/viscerium/image-variants -name manifest.json -type f -printf "%P %T@ %s\\n" | LC_ALL=C sort)
          test "$before_state" = "$after_state" || { echo "::error::Warm build rewrote the restored responsive cache"; exit 1; }
          test "$elapsed" -gt 0
          echo "ms=$elapsed" >> "$GITHUB_OUTPUT"
          echo "entries=$entries" >> "$GITHUB_OUTPUT"
      - name: Report build and restore times
        env:
          COLD_MS: ${{ needs.cold.outputs.build_ms }}
          WARM_MS: ${{ steps.warm_build.outputs.ms }}
          RESTORE_MS: ${{ steps.restore_time.outputs.ms }}
          COLD_VARIANTS: ${{ needs.cold.outputs.entries }}
          WARM_VARIANTS: ${{ steps.warm_build.outputs.entries }}
          CACHE_BYTES: ${{ needs.cold.outputs.bytes }}
          ATLAS_COLD_HIT: ${{ needs.cold.outputs.atlas_hit }}
          ATLAS_WARM_HIT: ${{ steps.atlas.outputs.cache-hit }}
          ATLAS_COLD_KEY: ${{ needs.cold.outputs.atlas_key }}
          ATLAS_WARM_KEY: ${{ steps.atlas.outputs.cache-matched-key }}
          RESPONSIVE_HIT: ${{ steps.responsive.outputs.cache-hit }}
          BENCHMARK_JSON: ${{ runner.temp }}/responsive-cache-benchmark.json
        run: node .github/scripts/report-responsive-cache-benchmark.mjs
      - name: Upload benchmark measurements
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: responsive-cache-benchmark
          path: ${{ runner.temp }}/responsive-cache-benchmark.json
          if-no-files-found: error
          retention-days: 7
