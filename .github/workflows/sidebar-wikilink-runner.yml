name: Temporary sidebar wikilink runner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sidebar-wikilink-runner.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/sidebar-wikilinks-all-articles
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json

      - name: Execute and report migration
        shell: bash
        run: |
          set +e
          log="sidebar-migration-run.log"
          : > "$log"
          failed=0

          run_step() {
            label="$1"
            shift
            printf '\n===== %s =====\n' "$label" | tee -a "$log"
            "$@" >> "$log" 2>&1
            status=$?
            if [ "$status" -ne 0 ]; then
              printf '\nFAILED: %s (exit %s)\n' "$label" "$status" | tee -a "$log"
              failed="$status"
              return "$status"
            fi
            printf '\nPASSED: %s\n' "$label" | tee -a "$log"
            return 0
          }

          run_step "Install dependencies" npm --prefix Site ci --silent --no-audit --no-fund || true
          if [ "$failed" -eq 0 ]; then run_step "Apply migration" npm --prefix Site run migration:sidebar-wikilinks:write || true; fi
          if [ "$failed" -eq 0 ]; then run_step "Regenerate public content" npm --prefix Site run sync || true; fi
          if [ "$failed" -eq 0 ]; then run_step "Run unit tests" npm --prefix Site run test:unit || true; fi
          if [ "$failed" -eq 0 ]; then run_step "Build site" npm --prefix Site run build || true; fi

          git fetch origin main --depth=1
          git show origin/main:.github/workflows/checks.yml > .github/workflows/checks.yml
          rm -f .github/workflows/sidebar-wikilink-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$failed" -ne 0 ]; then
            git add -A "$log"
            git commit -m "Record sidebar migration failure"
            git push origin HEAD:fix/sidebar-wikilinks-all-articles
            exit "$failed"
          fi

          rm -f "$log"
          git add -A
          git commit -m "Migrate article sidebars to Obsidian links"
          git push origin HEAD:fix/sidebar-wikilinks-all-articles
