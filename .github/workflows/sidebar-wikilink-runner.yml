name: Temporary sidebar wikilink runner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sidebar-wikilink-runner.yml

permissions:
  contents: write

jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/sidebar-wikilinks-all-articles
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json

      - name: Install dependencies
        run: npm --prefix Site ci --silent --no-audit --no-fund

      - name: Isolate migration checks
        run: |
          npm --prefix Site run migration:sidebar-wikilinks:write > sidebar-isolation.log 2>&1
          npm --prefix Site run sync >> sidebar-isolation.log 2>&1
          npm --prefix Site run frontmatter:folders:audit >> sidebar-isolation.log 2>&1
          cd Site
          node --test tests/folder-frontmatter-backfill.test.mjs >> ../sidebar-isolation.log 2>&1

      - name: Commit isolation log only
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/checks.yml > .github/workflows/checks.yml
          rm -f .github/workflows/sidebar-wikilink-migration.yml sidebar-migration-run.log sidebar-frontmatter-diagnostic.log
          git restore Vault Site/src/content/docs Site/public
          rm -f Site/scripts/diagnose-sidebar-frontmatter.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Isolate sidebar migration validation"
          git push origin HEAD:fix/sidebar-wikilinks-all-articles
