name: Temporary sidebar wikilink runner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sidebar-wikilink-runner.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/sidebar-wikilinks-all-articles
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json

      - name: Install dependencies
        run: npm --prefix Site ci --silent --no-audit --no-fund

      - name: Apply migration
        run: npm --prefix Site run migration:sidebar-wikilinks:write

      - name: Regenerate public content
        run: npm --prefix Site run sync

      - name: Run unit tests
        run: npm --prefix Site run test:unit

      - name: Build site
        run: npm --prefix Site run build

      - name: Commit branch output
        shell: bash
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/checks.yml > .github/workflows/checks.yml
          rm -f .github/workflows/sidebar-wikilink-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate article sidebars to Obsidian links"
          git push origin HEAD:fix/sidebar-wikilinks-all-articles
