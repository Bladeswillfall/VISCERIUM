name: Generate Astro 7.4 lockfile for PR 276

on:
  push:
    branches:
      - feat/astro-74-parallel-prerender-20261015
    paths:
      - .github/workflows/astro-276-relock.yml

permissions:
  contents: write

jobs:
  update:
    if: github.repository == 'Bladeswillfall/VISCERIUM'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Use repository npm version
        run: |
          npm install --global npm@11.18.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.18.0"
      - name: Regenerate manifest and lock with npm
        working-directory: Site
        run: npm install --package-lock-only --save --save-prefix='^' --ignore-scripts --no-audit --no-fund astro@7.4.0 @astrojs/mdx@8.0.3 @astrojs/starlight@0.42.6
      - name: Regenerate managed dependency notices
        working-directory: Site
        run: npm run notices:update
      - name: Validate generated files
        run: |
          git diff --check
          node -e "const p=require('./Site/package.json');const l=require('./Site/package-lock.json');for(const n of ['astro','@astrojs/mdx','@astrojs/starlight']){if(p.dependencies[n]!==l.packages[''].dependencies[n])throw Error(n+' differs between manifest and lock')}if(l.packages['node_modules/astro'].version!=='7.4.0')throw Error('Astro not locked to 7.4.0')"
      - name: Commit generated files to PR 276 branch
        env:
          PR_BRANCH: feat/astro-74-parallel-prerender-20261015
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Site/package.json Site/package-lock.json THIRD_PARTY_NOTICES.md
          if git diff --cached --quiet; then
            echo "No dependency changes generated"
            exit 1
          fi
          git commit -m "build(deps): upgrade Astro 7.4 and grouped integrations"
          git push origin "HEAD:refs/heads/$PR_BRANCH"
