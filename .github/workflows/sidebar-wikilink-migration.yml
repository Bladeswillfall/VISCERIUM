name: Sidebar wikilink migration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: sidebar-wikilink-migration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/sidebar-wikilinks-all-articles
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json

      - name: Install dependencies
        run: npm --prefix Site ci

      - name: Migrate sidebar references
        run: npm --prefix Site run migration:sidebar-wikilinks:write

      - name: Regenerate public content
        run: npm --prefix Site run sync

      - name: Run unit tests
        run: npm --prefix Site run test:unit

      - name: Build site
        run: npm --prefix Site run build

      - name: Commit migration output
        shell: bash
        run: |
          rm .github/workflows/sidebar-wikilink-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Migration produced no repository changes."
            exit 0
          fi
          git commit -m "Migrate article sidebars to Obsidian links"
          git push origin HEAD:fix/sidebar-wikilinks-all-articles
