name: One-shot Creator Identity Migration

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Migrate tracked source identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          generated = Path('Site/src/content/docs')
          generated_legacy = []
          for path in generated.rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text('utf-8')
              except UnicodeDecodeError:
                  continue
              if 'Bladeswillfall' in text or re.search(r'\bFall\b', text) or re.search(r'\bJake\b', text):
                  generated_legacy.append(path.as_posix())
          Path('/tmp/generated-legacy-paths.txt').write_text('\n'.join(generated_legacy), 'utf-8')

          replacements = [
              ("_All artwork that isn't an original creation by myself ([@Bladeswillfall](https://www.worldanvil.com/author/Bladeswillfall)) will be replaced with either original pieces or commissioned art._",
               "_All artwork that isn't an original creation by Elias Vail will be replaced with either original pieces or commissioned art._"),
              ("[Me (Fall)](https://www.worldanvil.com/author/Bladeswillfall)", "Elias Vail"),
              ("[Fall (me)](https://www.worldanvil.com/author/Bladeswillfall)", "Elias Vail"),
              ("[Fall](https://www.worldanvil.com/author/Bladeswillfall)", "Elias Vail"),
              ("[@Bladeswillfall](https://www.worldanvil.com/author/Bladeswillfall)", "Elias Vail"),
              ("[Fall](https://github.com/Bladeswillfall)", "Elias Vail"),
              ("Rings of Errack by Fall (me)", "Rings of Errack by Elias Vail"),
              ("by Me (Fall)", "by Elias Vail"),
              ("by Fall (me)", "by Elias Vail"),
              ("photobashed by Fall", "photobashed by Elias Vail"),
              ("original creation by Fall", "original creation by Elias Vail"),
              ("artist: Fall", "artist: Elias Vail"),
              ('editor: "Fall"', 'editor: "Elias Vail"'),
              ("  - name: Fall", "  - name: Elias Vail"),
              ("Me (Fall)", "Elias Vail"),
              ("Fall — 08/08/2022", "Elias Vail — 08/08/2022"),
              ("awarded to Bladeswillfall", "awarded to Elias Vail"),
              ('"author": "Bladeswillfall"', '"author": "Elias Vail"'),
              ("viscerium-bladeswillfall", "viscerium"),
          ]

          for path in Path('.').rglob('*'):
              rel = path.as_posix()
              if not path.is_file() or rel.startswith('Site/src/content/docs/') or rel.startswith('.git/'):
                  continue
              try:
                  text = path.read_text('utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              text = text.replace('https://www.worldanvil.com/author/Bladeswillfall', 'https://www.viscerium.co.uk/')
              text = text.replace('@Bladeswillfall', 'Elias Vail')
              if text != original:
                  path.write_text(text, 'utf-8')

          Path('.github/CODEOWNERS').write_text(
              '# CODEOWNER rules intentionally omit a personal account handle.\n'
              '# Repository permissions and branch rules remain the source of maintainer authority.\n',
              'utf-8',
          )

          special_replacements = {
              '.github/SECURITY.md': [
                  ('Please use [GitHub Private Vulnerability Reporting](https://github.com/Bladeswillfall/VISCERIUM/security/advisories/new). Do not open a public issue for an unpatched vulnerability, leaked credential, bypass, or exploit.',
                   'Please use the private channel described on the [VISCERIUM contact page](https://www.viscerium.co.uk/contact/) and the canonical [`security.txt`](https://www.viscerium.co.uk/.well-known/security.txt). Do not open a public issue for an unpatched vulnerability, leaked credential, bypass, or exploit.'),
              ],
              'Architecture/README.md': [
                  ('Remote: GitHub repository `Bladeswillfall/VISCERIUM`.', 'Remote: the VISCERIUM GitHub repository configured for the working checkout.'),
              ],
              'Architecture/viscerium-architecture.html': [
                  ('Repository: Bladeswillfall/VISCERIUM ·', 'Repository: VISCERIUM ·'),
              ],
              'Architecture/viscerium-architecture.json': [
                  ('"repository": "Bladeswillfall/VISCERIUM"', '"repository": "VISCERIUM"'),
              ],
              'Vault/System/SOPs/Codex Publishing and Deployment SOP.md': [
                  ('The site is configured for repository `Bladeswillfall/VISCERIUM` and the `Comments` discussion category.',
                   'The site can expose a public repository URL through `PUBLIC_GITHUB_REPO_URL` and uses the `Comments` discussion category.'),
              ],
          }
          for rel, pairs in special_replacements.items():
              path = Path(rel)
              text = path.read_text('utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, 'utf-8')

          path = Path('CLOUDFLARE_PAGES_SETUP.md')
          text = path.read_text('utf-8')
          text = text.replace('Connect the new Pages project to `Bladeswillfall/VISCERIUM` and use:',
                              'Connect the Pages project to the VISCERIUM repository and use:')
          text = text.replace(
              'SITE_URL=https://www.viscerium.co.uk\n',
              'SITE_URL=https://www.viscerium.co.uk\n'
              'PUBLIC_GITHUB_REPO_URL=<public repository URL, if repository/edit/issue links should be shown>\n'
              'PUBLIC_GITHUB_PROFILE_URL=<public creator profile URL, only if rel="me authn" is required>\n',
          )
          text = text.replace(
              'No secret is required in Cloudflare Pages for the current public JF2 API integration. The site advertises `https://github.com/Bladeswillfall` as its explicit IndieLogin authentication identity using `rel="me authn"`. The corresponding GitHub profile Website field must point back to `https://www.viscerium.co.uk/` so IndieLogin can verify the relationship in both directions.\n\nBefore relying on the service in production, sign in to Webmention.io with `https://www.viscerium.co.uk`, authenticate through the advertised GitHub identity, complete the domain verification, and confirm that the assigned username is `www.viscerium.co.uk`.',
              'No secret is required in Cloudflare Pages for the current public JF2 API integration. `PUBLIC_GITHUB_PROFILE_URL` is optional; when set, the site advertises that URL using `rel="me authn"`. Keep it unset unless the selected IndieLogin identity is intentionally public and its profile links back to `https://www.viscerium.co.uk/`.\n\nBefore relying on the service in production, sign in to Webmention.io with `https://www.viscerium.co.uk`, complete the domain verification using the public identity you have deliberately configured, and confirm that the assigned username is `www.viscerium.co.uk`.',
          )
          path.write_text(text, 'utf-8')

          path = Path('Site/.env.example')
          text = path.read_text('utf-8')
          needle = 'LORE_SOURCE_DIR="../Vault/Lore"\n'
          if 'PUBLIC_GITHUB_REPO_URL' not in text:
              text = text.replace(
                  needle,
                  needle + '\n# Optional public GitHub links. Leave blank to keep the creator account/repository owner out of the site UI.\n'
                  'PUBLIC_GITHUB_REPO_URL=""\nPUBLIC_GITHUB_PROFILE_URL=""\n',
              )
          path.write_text(text, 'utf-8')

          path = Path('Site/wrangler.toml')
          text = path.read_text('utf-8')
          text = text.replace('PUBLIC_CONTACT_FORM_ENABLED = "1"', 'PUBLIC_CONTACT_FORM_ENABLED = "0"')
          text = text.replace('PUBLIC_CONTACT_FORM_ENDPOINT = "https://viscerium-site-services.bladeswillfall.workers.dev/contact"',
                              'PUBLIC_CONTACT_FORM_ENDPOINT = ""')
          path.write_text(text, 'utf-8')

          path = Path('Site/tests/browser/era-primer.spec.mjs')
          text = path.read_text('utf-8')
          text = re.sub(
              r"\n    await expect\(page\.getByRole\('link', \{ name: /Edit page/ \}\)\)\.toHaveAttribute\(\n      'href',\n      `https://github\.com/Bladeswillfall/VISCERIUM/edit/main/Vault/Lore/Eras/\$\{era\.source\}`,\n    \);",
              "\n    await expect(page.getByRole('link', { name: /Edit page/ })).toHaveCount(0);",
              text,
          )
          path.write_text(text, 'utf-8')

          path = Path('Site/tests/browser/contact.spec.mjs')
          text = path.read_text('utf-8')
          text = text.replace("const githubIssueUrl = 'https://github.com/Bladeswillfall/VISCERIUM/issues/new/choose';\n", '')
          text = text.replace("test('contact page keeps public issues secondary when private messaging is unavailable', async ({ page, context }) => {",
                              "test('contact page keeps public issues secondary when private messaging is unavailable', async ({ page }) => {")
          text = re.sub(
              r"  await context\.route\(`\$\{githubIssueUrl\}\*`, async \(route\) => \{\n    await route\.fulfill\(\{ status: 200, contentType: 'text/plain', body: 'GitHub issue chooser test fixture' \}\);\n  \}\);\n",
              '', text,
          )
          text = text.replace("'GitHub so it can be tracked publicly.'", "'the support page so it can be tracked publicly.'")
          text = text.replace("'GitHub so the discussion and fix stay attached'", "'the support page so the discussion and fix stay attached'")
          text = text.replace("  await expect(page.locator('.contact-github-card .codex-icon')).toBeVisible();\n",
                              "  await expect(page.locator('.contact-github-card .codex-icon')).toHaveCount(0);\n")
          text = re.sub(
              r"  await expect\(page\.getByRole\('link', \{ name: 'GitHub', exact: true \}\)\.first\(\)\)\.toHaveAttribute\(\n    'href',\n    'https://github\.com/Bladeswillfall/VISCERIUM/issues',\n  \);\n\n",
              '', text,
          )
          text = text.replace(
              "  const submitIssue = page.getByRole('link', { name: 'Submit an issue', exact: true });\n"
              "  await expect(submitIssue).toHaveAttribute('href', githubIssueUrl);\n"
              "  const popupPromise = page.waitForEvent('popup');\n"
              "  await submitIssue.click();\n"
              "  const popup = await popupPromise;\n"
              "  await expect(popup).toHaveURL(githubIssueUrl);\n"
              "  await popup.close();\n",
              "  const submitIssue = page.getByRole('link', { name: 'Submit an issue', exact: true });\n"
              "  await expect(submitIssue).toHaveAttribute('href', '/support/');\n",
          )
          path.write_text(text, 'utf-8')

          path = Path('Site/tests/errack-authoring-example.test.mjs')
          text = path.read_text('utf-8').replace(
              r"assert.match(section, /artwork by \[Fall\]\(https:\/\/github\.com\/Bladeswillfall\)/);",
              r"assert.match(section, /artwork by Elias Vail/);",
          )
          path.write_text(text, 'utf-8')

          for path in Path('Vault').rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text('utf-8')
              except UnicodeDecodeError:
                  continue
              if 'Bladeswillfall' in text or 'bladeswillfall' in text:
                  path.write_text(text.replace('Bladeswillfall', 'Elias Vail').replace('bladeswillfall', 'elias-vail'), 'utf-8')

          for rel in [
              'Tools/obsidian-viscerium-timelines/manifest.json',
              'Vault/.obsidian/plugins/viscerium-timelines/manifest.json',
          ]:
              path = Path(rel)
              path.write_text(path.read_text('utf-8').replace('"author": "Bladeswillfall"', '"author": "Elias Vail"'), 'utf-8')

          old_avatar = Path('Site/public/assets/contributors/fall.webp')
          new_avatar = Path('Site/public/assets/contributors/elias-vail.webp')
          if old_avatar.exists():
              new_avatar.write_bytes(old_avatar.read_bytes())
              old_avatar.unlink()
          PY
          git add -A

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json

      - name: Use npm with lifecycle-script policy support
        run: |
          npm install --global npm@11.18.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.18.0"

      - name: Regenerate published content from cleaned sources
        working-directory: Site
        run: |
          npm ci --silent --no-audit --no-fund
          npm run sync

      - name: Stage only generated files that contained the legacy identity
        shell: bash
        run: |
          while IFS= read -r path; do
            [ -n "$path" ] && git add -A -- "$path"
          done < /tmp/generated-legacy-paths.txt

      - name: Verify identity cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          failures = []
          identity_patterns = [
              re.compile(r'bladeswillfall', re.I),
              re.compile(r'\bJake\b'),
              re.compile(r'Me \(Fall\)'),
              re.compile(r'\b(?:artist|editor|name):\s*["\']?Fall\b'),
              re.compile(r'\bFall\s+—'),
              re.compile(r'\bby\s+Fall\b'),
              re.compile(r'\bcreated\s+by\s+Fall\b', re.I),
              re.compile(r'fall\.webp', re.I),
          ]
          for path in Path('.').rglob('*'):
              rel = path.as_posix()
              if (
                  not path.is_file()
                  or rel.startswith('.git/')
                  or 'node_modules/' in rel
                  or rel == '.github/workflows/source-snapshot.yml'
              ):
                  continue
              try:
                  text = path.read_text('utf-8')
              except UnicodeDecodeError:
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  if any(pattern.search(line) for pattern in identity_patterns):
                      failures.append(f'{path}:{line_no}:{line}')
          if failures:
              raise SystemExit('Legacy identity references remain:\n' + '\n'.join(failures[:100]))
          PY

      - name: Commit migration and remove this temporary workflow
        shell: bash
        run: |
          rm .github/workflows/source-snapshot.yml
          git add -A -- .github/workflows/source-snapshot.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "Elias Vail"
          git config user.email "noreply@viscerium.co.uk"
          git commit -m "chore: migrate creator identity to Elias Vail"
          git push origin "HEAD:${{ github.head_ref }}"
