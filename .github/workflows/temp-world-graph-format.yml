name: Temporary World Graph formatting

on:
  push:
    branches:
      - chore/axe-accessibility-checks

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: chore/axe-accessibility-checks

      - name: Format colour helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          graph = Path('Site/src/components/WorldGraph.astro')
          source = graph.read_text()
          start_marker = '  function colour(root: Element, name: string) {'
          end_marker = '\n\n  function labelStyle(root: Element, size: number) {'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('WorldGraph colour helper boundaries were not found')

          lines = source[start:end].splitlines()
          formatted = [lines[0]]
          formatted.extend(('  ' + line) if line else '' for line in lines[1:-1])
          formatted.append('  }')
          graph.write_text(source[:start] + '\n'.join(formatted) + source[end:])

          Path('.github/workflows/temp-world-graph-format.yml').unlink()
          PY

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Site/src/components/WorldGraph.astro .github/workflows/temp-world-graph-format.yml
          git commit -m 'Format World Graph colour helper'
          git push origin HEAD:chore/axe-accessibility-checks
