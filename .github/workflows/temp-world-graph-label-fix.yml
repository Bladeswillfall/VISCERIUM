name: Temporary World Graph label fix

on:
  push:
    branches:
      - chore/axe-accessibility-checks

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: chore/axe-accessibility-checks
          fetch-depth: 2

      - name: Patch Cytoscape colour boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          graph = Path('Site/src/components/WorldGraph.astro')
          source = graph.read_text()
          old = """  function colour(root: Element, name: string) {
            const probe = document.createElement('span');
            probe.style.color = `var(${name})`;
            root.append(probe);
            const value = getComputedStyle(probe).color;
            probe.remove();
            return value;
          }
          """
          new = """  function colour(root: Element, name: string) {
            const probe = document.createElement('span');
            probe.style.color = `var(${name})`;
            root.append(probe);
            const value = getComputedStyle(probe).color;
            probe.remove();

            // Cytoscape 3.34 does not reliably parse CSS Color 4 values such as
            // OKLCH. Resolve the browser-supported colour to legacy sRGB first.
            const raster = document.createElement('canvas');
            raster.width = 1;
            raster.height = 1;
            const context = raster.getContext('2d');
            if (!context) return value;
            context.fillStyle = value;
            context.fillRect(0, 0, 1, 1);
            const [red, green, blue, alpha] = context.getImageData(0, 0, 1, 1).data;
            if (alpha === 255) return `rgb(${red}, ${green}, ${blue})`;
            return `rgba(${red}, ${green}, ${blue}, ${alpha / 255})`;
          }
          """
          if old not in source:
              raise SystemExit('WorldGraph colour helper did not match expected source')
          graph.write_text(source.replace(old, new, 1))

          css = Path('Site/src/styles/graph.css')
          source = css.read_text()
          old_dark = """  /* Cytoscape 3.34 consumes these two values through getComputedStyle(). Keep
             them in legacy sRGB syntax so canvas labels do not fall back to black when
             the site palette resolves to OKLCH in modern browsers. */
            --world-graph-canvas: rgb(16, 16, 16);
            --world-graph-surface: var(--codex-palette-oled);
            --world-graph-border: var(--codex-palette-deep);
            --world-graph-text: rgb(200, 191, 168);
          """
          new_dark = """  --world-graph-canvas: var(--codex-palette-ink);
            --world-graph-surface: var(--codex-palette-oled);
            --world-graph-border: var(--codex-palette-deep);
            --world-graph-text: var(--codex-palette-light);
          """
          old_light = """  --world-graph-canvas: rgb(185, 180, 169);
            --world-graph-surface: var(--codex-palette-light);
            --world-graph-border: var(--codex-palette-mid);
            --world-graph-text: rgb(0, 0, 0);
          """
          new_light = """  --world-graph-canvas: var(--codex-palette-page-light);
            --world-graph-surface: var(--codex-palette-light);
            --world-graph-border: var(--codex-palette-mid);
            --world-graph-text: var(--codex-palette-oled);
          """
          if old_dark not in source or old_light not in source:
              raise SystemExit('graph.css compatibility literals did not match expected source')
          source = source.replace(old_dark, new_dark, 1).replace(old_light, new_light, 1)
          css.write_text(source)

          Path('.github/workflows/temp-world-graph-label-fix.yml').unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Site/src/components/WorldGraph.astro Site/src/styles/graph.css .github/workflows/temp-world-graph-label-fix.yml
          git commit -m 'Fix Cytoscape World Graph label colours'
          git push origin HEAD:chore/axe-accessibility-checks
