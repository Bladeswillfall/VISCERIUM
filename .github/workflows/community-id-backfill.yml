name: Community ID backfill

on:
  push:
    branches: [feature/community-kudos]
    paths:
      - .github/workflows/community-id-backfill.yml
      - Site/scripts/backfill-community-ids.mjs

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json

      - name: Use repository npm version
        run: |
          npm install --global npm@11.18.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.18.0"

      - name: Install Site dependencies
        working-directory: Site
        run: npm ci --silent --no-audit --no-fund

      - name: Backfill Community IDs
        working-directory: Site
        run: node scripts/backfill-community-ids.mjs

      - name: Commit Community IDs
        run: |
          if git diff --quiet -- Vault/Lore; then
            echo "No Community IDs needed."
            exit 0
          fi
          git diff --check -- Vault/Lore
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Vault/Lore
          git commit -m "Backfill Community page IDs"
          git push
