name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Site
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 500
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json

      - name: Use npm with lifecycle-script policy support
        working-directory: .
        run: |
          npm install --global npm@11.18.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.18.0"

      - run: npm ci --silent --no-audit --no-fund
      - run: npm run baseline:check
      - run: npm run doctor:vault
      - run: npm run notices:check

  unit:
    name: Unit tests and benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Site
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 500
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json

      - name: Use npm with lifecycle-script policy support
        working-directory: .
        run: |
          npm install --global npm@11.18.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.18.0"

      - run: npm ci --silent --no-audit --no-fund

      - name: Run unit tests
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"

      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-log
          path: ${{ runner.temp }}/unit-tests.log
          if-no-files-found: warn
          retention-days: 1

      - run: npm run benchmark:timelines

  gateway:
    name: Comment gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Services/comment-gateway
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 500
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Services/comment-gateway/package-lock.json

      - name: Use npm with lifecycle-script policy support
        working-directory: .
        run: |
          npm install --global npm@11.18.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.18.0"

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Site
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 500
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json

      - name: Use npm with lifecycle-script policy support
        working-directory: .
        run: |
          npm install --global npm@11.18.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.18.0"

      - run: npm ci --silent --no-audit --no-fund
      - run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist
          path: Site/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  obsidian_plugin:
    name: Obsidian timeline plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 500
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Tools/obsidian-viscerium-timelines/package-lock.json

      - name: Use npm with lifecycle-script policy support
        run: |
          npm install --global npm@11.18.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.18.0"

      - name: Build Obsidian timeline plugin
        working-directory: Tools/obsidian-viscerium-timelines
        run: |
          npm ci --no-audit --no-fund
          npm run build
          grep -q 'open-storyline-project-timeline' dist/main.js
          grep -q 'diagnose-storyline-integration' dist/main.js

      - name: Upload Obsidian timeline plugin bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viscerium-timelines-plugin
          path: Tools/obsidian-viscerium-timelines/dist/
          if-no-files-found: error
          retention-days: 1

      - name: Verify checked-in Obsidian timeline plugin bundle
        working-directory: Tools/obsidian-viscerium-timelines
        run: |
          cmp --silent dist/main.js ../../Vault/.obsidian/plugins/viscerium-timelines/main.js || {
            echo "::error file=Vault/.obsidian/plugins/viscerium-timelines/main.js::Checked-in timeline plugin JavaScript is stale. Run 'cd Tools/obsidian-viscerium-timelines && npm run build:sync', then commit the updated Vault plugin payload."
            exit 1
          }
          cmp --silent dist/styles.css ../../Vault/.obsidian/plugins/viscerium-timelines/styles.css || {
            echo "::error file=Vault/.obsidian/plugins/viscerium-timelines/styles.css::Checked-in timeline plugin CSS is stale. Run 'cd Tools/obsidian-viscerium-timelines && npm run build:sync', then commit the updated Vault plugin payload."
            exit 1
          }
          cmp --silent dist/manifest.json ../../Vault/.obsidian/plugins/viscerium-timelines/manifest.json || {
            echo "::error file=Vault/.obsidian/plugins/viscerium-timelines/manifest.json::Checked-in timeline plugin manifest is stale. Run 'cd Tools/obsidian-viscerium-timelines && npm run build:sync', then commit the updated Vault plugin payload."
            exit 1
          }

  browser:
    name: Browser checks
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Site
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 500
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json

      - name: Use npm with lifecycle-script policy support
        working-directory: .
        run: |
          npm install --global npm@11.18.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.18.0"

      - run: npm ci --silent --no-audit --no-fund

      - name: Download production build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist
          path: Site/dist/

      - name: Install browser runtime
        run: npx --no-install playwright install --with-deps chromium firefox webkit

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > "$RUNNER_TEMP/viscerium-preview.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4321/eras/citadel/ > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/viscerium-preview.log"
          exit 1

      - name: Run browser checks
        run: |
          set -o pipefail
          {
            npx --no-install playwright test tests/browser --browser=chromium --reporter=line --workers=1
            npx --no-install playwright test tests/browser/graph*.spec.mjs --browser=firefox --reporter=line --workers=1
            npx --no-install playwright test tests/browser/graph*.spec.mjs --browser=webkit --reporter=line --workers=1
          } 2>&1 | tee "$RUNNER_TEMP/playwright.log"

      - name: Build enabled contact browser fixture
        env:
          PUBLIC_CONTACT_FORM_ENABLED: '1'
          PUBLIC_CONTACT_FORM_ENDPOINT: 'https://contact-form.invalid/submit'
          PUBLIC_TURNSTILE_SITE_KEY: '1x00000000000000000000AA'
        run: npm run build

      - name: Start enabled contact preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4322 > "$RUNNER_TEMP/viscerium-contact-preview.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4322/contact/ > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/viscerium-contact-preview.log"
          exit 1

      - name: Run enabled contact browser check
        env:
          CONTACT_FORM_TEST_ENABLED: '1'
          CONTACT_TEST_BASE_URL: 'http://127.0.0.1:4322'
        run: |
          set -o pipefail
          npx --no-install playwright test tests/browser/contact.spec.mjs \
            --browser=chromium --reporter=line --workers=1 \
            --grep "enabled private contact form" 2>&1 | tee -a "$RUNNER_TEMP/playwright.log"

      - name: Upload browser check log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-check-log
          path: ${{ runner.temp }}/playwright.log
          if-no-files-found: warn
          retention-days: 1

  verify:
    needs:
      - repository
      - unit
      - gateway
      - build
      - obsidian_plugin
      - browser
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks to pass
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          GATEWAY_RESULT: ${{ needs.gateway.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          OBSIDIAN_PLUGIN_RESULT: ${{ needs.obsidian_plugin.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$REPOSITORY_RESULT" = "success"
          test "$UNIT_RESULT" = "success"
          test "$GATEWAY_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
          test "$OBSIDIAN_PLUGIN_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
