name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migrate-sidebars:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json

      - name: Install dependencies
        run: npm --prefix Site ci --silent --no-audit --no-fund

      - name: Migrate sidebar references
        run: npm --prefix Site run migration:sidebar-wikilinks:write

      - name: Regenerate public content
        run: npm --prefix Site run sync

      - name: Run unit tests
        run: npm --prefix Site run test:unit

      - name: Build site
        run: npm --prefix Site run build

      - name: Commit migration output
        shell: bash
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/checks.yml > .github/workflows/checks.yml
          rm -f .github/workflows/sidebar-wikilink-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Migration produced no repository changes."
            exit 0
          fi
          git commit -m "Migrate article sidebars to Obsidian links"
          git push origin HEAD:${{ github.head_ref }}

  verify:
    if: github.actor == 'github-actions[bot]' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Site
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 500
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json

      - run: npm ci --silent --no-audit --no-fund
      - run: npm run doctor:vault
      - run: npm run rights:check

      - name: Run unit tests
        run: |
          set -o pipefail
          npm run test:unit 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"

      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-log
          path: ${{ runner.temp }}/unit-tests.log
          if-no-files-found: warn
          retention-days: 1

      - run: npm run benchmark:timelines
      - run: npm run build

      - name: Build Obsidian timeline plugin
        working-directory: Tools/obsidian-viscerium-timelines
        run: |
          npm ci --no-audit --no-fund
          npm run build
          grep -q 'open-storyline-project-timeline' dist/main.js
          grep -q 'diagnose-storyline-integration' dist/main.js
          cmp --silent dist/main.js ../../Vault/.obsidian/plugins/viscerium-timelines/main.js
          cmp --silent dist/styles.css ../../Vault/.obsidian/plugins/viscerium-timelines/styles.css
          cmp --silent dist/manifest.json ../../Vault/.obsidian/plugins/viscerium-timelines/manifest.json

      - name: Upload Obsidian timeline plugin bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: viscerium-timelines-plugin
          path: Tools/obsidian-viscerium-timelines/dist/
          if-no-files-found: error
          retention-days: 1

      - name: Install browser runtime
        run: npx --no-install playwright install --with-deps chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > "$RUNNER_TEMP/viscerium-preview.log" 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4321/eras/citadel/ > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/viscerium-preview.log"
          exit 1

      - name: Run browser checks
        run: |
          set -o pipefail
          npx --no-install playwright test tests/browser --reporter=line --workers=1 2>&1 | tee "$RUNNER_TEMP/playwright.log"

      - name: Upload browser check log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-check-log
          path: ${{ runner.temp }}/playwright.log
          if-no-files-found: warn
          retention-days: 1
