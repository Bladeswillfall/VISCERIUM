name: Refresh Astro check dependencies

on:
  push:
    branches:
      - chore/astro-check-baseline-cleanup

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          show-progress: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Site/package-lock.json

      - name: Use repository npm version
        run: |
          npm install --global npm@11.18.0 --ignore-scripts --no-audit --no-fund
          test "$(npm --version)" = "11.18.0"

      - name: Refresh dependency metadata
        working-directory: Site
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --silent --no-audit --no-fund
          npm run notices:update

      - name: Commit generated metadata
        run: |
          git add Site/package-lock.json THIRD_PARTY_NOTICES.md README.md LICENSE.md ATTRIBUTION.md LICENSE-CODE.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Astro check dependency metadata"
          git push
